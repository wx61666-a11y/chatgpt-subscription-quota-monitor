name: Build desktop packages

on:
  push:
  workflow_dispatch:

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: mac
            artifact_name: macos-latest-packages
            artifact_path: dist/*.dmg

          - os: windows-latest
            script: win
            artifact_name: windows-latest-packages
            artifact_path: dist/*Setup*.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build package
        run: npm run dist:${{ matrix.script }} -- --publish never

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
