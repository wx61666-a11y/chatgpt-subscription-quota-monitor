name: Build desktop packages

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: mac
            artifact_name: macos-latest-packages
            artifact_path: dist/*.dmg

          - os: windows-latest
            script: win
            artifact_name: windows-latest-packages
            artifact_path: dist/*Setup*.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build package
        run: npm run dist:${{ matrix.script }} -- --publish never

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  release:
    needs: package
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download macOS installer
        uses: actions/download-artifact@v4
        with:
          name: macos-latest-packages
          path: release/macos

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: windows-latest-packages
          path: release/windows

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ChatGPT Subscription Quota Monitor v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            release/macos/*.dmg
            release/windows/*Setup*.exe
