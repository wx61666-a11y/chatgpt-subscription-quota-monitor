<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="styles.css"><title>ChatGPT 订阅额度</title></head><body>
<main><header><div><h1>ChatGPT 订阅额度</h1><p>本机 Codex 用量 · 每 30 秒刷新</p></div><button id="refresh">↻</button></header><section class="rings"><article><h2>周额度</h2><div class="ring" id="weeklyRing"><b id="weeklyValue">—</b><span>已使用</span></div><small id="weeklyReset">等待本机额度事件</small></article><article><h2>5 小时额度</h2><div class="ring" id="fiveHourRing"><b id="fiveHourValue">—</b><span>已使用</span></div><small id="fiveHourReset">等待本机额度事件</small></article></section><section class="heat"><h2>近 90 天本机用量</h2><div id="heatmap"></div></section><section class="controls"><div><label>状态栏</label><label><input id="weeklyToggle" type="checkbox" checked> 周额度</label><label><input id="fiveToggle" type="checkbox" checked> 5小时额度</label><label><input id="textToggle" type="checkbox" checked> 文字</label></div><div><label>皮肤</label><button data-skin="aurora" class="active">极光棱镜</button><button data-skin="sunset">落日玻璃</button><button data-skin="opal">蛋白石光谱</button></div></section></main><script src="renderer.js"></script></body></html>
